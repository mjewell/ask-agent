name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The process tests (ps output, zombie reaping, process-group kills) are the ones most
    # likely to differ by platform, and they are only ever exercised on macOS locally.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum version the README claims, kept because macOS still ships 3.9 as its
          # system python3. Pinned to 24.04 because setup-python has no 3.9 build for 26.04,
          # which is what ubuntu-latest became in November 2026.
          - { os: ubuntu-24.04, python: '3.9' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: macos-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/test_runner.py

